# Slack conversations for Apiary, via the dev.apiary.slack source plugin.
#
# The plugin turns each human turn in Slack into a work item, and posts what
# the workflow publishes back into the same thread. SLACK_BOT_TOKEN must be in
# the daemon's environment (its .env) — it never goes in this file.

# Relative entries resolve against this file's directory.
plugin_dirs:
  - .apiary/plugins

plugins:
  - id: dev.apiary.slack
    # One poll is 1 call per channel + 1 per watched thread; the 10s default
    # is tight once a few conversations are live.
    timeout: 30s
    config:
      # Absolute. A plugin's working directory is its own install directory,
      # not the project root.
      state_file: /home/you/projects/acme/.apiary/slack-state.json
      channels:
        - id: C0123456789        # #eng — answer only when @mentioned
          mode: mentions
          labels: ["team:eng"]
        - id: C0987654321        # #ask-apiary — every message is a question
          mode: all
      direct_messages: true
      # Anyone who can reach the bot can drive an agent. Name who may.
      allowed_users: [U01ABCDEF, U02GHIJKL]
      ack_reaction: eyes

sources:
  - id: slack
    type: plugin
    poll_interval: 30s
    config:
      plugin: dev.apiary.slack

workflows:
  - id: slack-chat
    trigger:
      # Deliberately NOT `once: true`: the item is the whole thread, and it is
      # dispatched again for every human turn. What stops a re-run is the
      # state — the plugin flips it from pending to answered when the host
      # acknowledges the dispatch, and back to pending on the next turn.
      match:
        # Always pin the source. Unpinned, a write-back step validates against
        # any other source in the hive and then silently no-ops here.
        source: slack
        states: [pending]
    # Post only what the agent publishes. `result_comment: on_complete` would
    # work too, but it wraps the output in a "Workflow: … — ✓ Done" header and
    # the workflow memory — right for an issue tracker, noise in a chat.
    result_comment: on_fail
    steps:
      - id: answer
        agent: assistant
        prompt: |
          You are answering a message in Slack. The task body holds the
          conversation so far and the latest message. Answer the latest
          message, briefly, in Markdown. The repository is at
          /home/you/projects/acme.

          Put your answer — and nothing else — between these markers. Only
          that text is posted to Slack:

          APIARY_PUBLISH_BEGIN
          <your answer>
          APIARY_PUBLISH_END
